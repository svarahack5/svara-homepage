<!-- SVARA forum add-on: paste this whole block just before </body> in forum.html -->
<style>
/* forum-theme.css: dark, animated look to match the homepage */

/* ---------- colours (forces the dark theme) ---------- */
:root:root:root{
  color-scheme:dark;
  --bg:#0e0a17; --card:#1a1428; --ink:#efeaf8; --mute:#b3a7c9; --line:#352b4d;
  --accent:#b79bf2; --accent2:#7d55d6; --accent-ink:#1a1228; --soft:#2c2342; --warn:#f0a090;
  --shadow:0 10px 30px rgba(0,0,0,.3);
}
html{scroll-behavior:smooth}
body{
  top:0!important;overflow-x:hidden;
  background:radial-gradient(900px 500px at 90% 20%,rgba(125,85,214,.14),transparent),var(--bg);
  font-family:"Atkinson Hyperlegible","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Gujarati","Noto Sans Gurmukhi","Noto Sans Kannada","Noto Sans Malayalam","Noto Sans Oriya","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Ol Chiki","Noto Sans Meetei Mayek","Noto Naskh Arabic",Verdana,system-ui,sans-serif;
}
/* slow moving colour blobs behind everything */
body::before{
  content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;animation:drift 22s ease-in-out infinite alternate;
  background:radial-gradient(40% 45% at 20% 30%,rgba(125,85,214,.35),transparent),radial-gradient(35% 40% at 80% 65%,rgba(154,111,224,.22),transparent),radial-gradient(28% 35% at 55% 5%,rgba(226,120,200,.12),transparent);
}
h1,h2{color:#f1e9ff}

/* ---------- header ---------- */
header{
  background:rgba(16,10,28,.45);border-bottom:1px solid rgba(183,155,242,.13);
  -webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);transition:background .4s;
}
header.s{background:rgba(16,10,28,.78)}
/* thin scroll progress line */
header::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:calc(var(--sp,0)*100%);background:linear-gradient(90deg,var(--accent2),#e6d3ff)}
.brand .logo{filter:brightness(1.9) saturate(.85)}
.bar{justify-content:flex-start}
#user{margin-left:auto}

/* ---------- buttons ---------- */
.btn{background:linear-gradient(135deg,#7d55d6,#a47cf0);color:#fff}
.btn:hover{filter:brightness(1.1);transform:translateY(-2px)}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--accent);border:1px solid rgba(183,155,242,.3)}
.btn.ghost:hover{background:var(--accent2);color:#fff}
.btn.link{background:none;color:var(--accent)}
.votes button{transition:transform .15s,color .15s,background .15s}
.votes button:hover{color:var(--accent);background:var(--soft)}
.votes button:active{transform:scale(1.5)}

/* ---------- cards and tiles ---------- */
.card,.tile{
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),var(--card);
  box-shadow:var(--shadow);transition:transform .4s cubic-bezier(.2,.7,.2,1),border-color .3s,box-shadow .3s;
}
.card{border-radius:18px}
/* soft glow that follows the mouse */
.card::before,.tile::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(280px circle at var(--x,50%) var(--y,0%),rgba(183,155,242,.24),transparent 70%);
}
.card:hover::before,.tile:hover::before{opacity:1}
.thread:hover{transform:translateY(-6px);border-color:var(--accent2)}
.tile:hover{transform:translateY(-7px) scale(1.02);border-color:var(--accent2);box-shadow:0 14px 34px rgba(125,85,214,.3)}
.tile span{display:inline-block;animation:bob 4s ease-in-out infinite}
.tile:nth-child(2) span{animation-delay:-1.3s}
.tile:nth-child(3) span{animation-delay:-2.6s}
.enter:hover{transform:translateY(-4px) scale(1.01)}
input,textarea,select{background:rgba(255,255,255,.05)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent2);box-shadow:0 0 0 6px rgba(125,85,214,.2)}

/* glowing rings around the big orb */
.heroorb{position:relative}
.heroorb::before,.heroorb::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(183,155,242,.55);pointer-events:none;animation:ring 4.5s ease-out infinite}
.heroorb::after{animation-delay:2.25s}

/* ---------- entrance animation (class added by forum-extras.js) ---------- */
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms)}

/* ---------- language switcher ---------- */
.skiptranslate iframe,iframe.skiptranslate,#goog-gt-tt,.goog-te-balloon-frame{display:none!important}
.goog-text-highlight{background:none!important;box-shadow:none!important}
#gt{position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden}
.lang{position:relative}
.lp{
  position:absolute;right:0;top:calc(100% + 12px);width:min(390px,92vw);max-height:68vh;overflow:auto;display:none;
  grid-template-columns:1fr 1fr;gap:6px;padding:10px;border-radius:18px;z-index:30;
  background:rgba(22,15,38,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:1px solid rgba(183,155,242,.25);box-shadow:0 20px 60px rgba(0,0,0,.55);
}
.lp.open{display:grid;animation:lpop .3s cubic-bezier(.2,.9,.3,1.2)}
.lo{font:inherit;text-align:left;cursor:pointer;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid transparent;border-radius:12px;padding:8px 12px;transition:.2s}
.lo:hover{background:rgba(183,155,242,.16);transform:translateY(-1px)}
.lo.on{border-color:var(--accent);background:rgba(183,155,242,.2)}
.lo b{display:block;font-size:1.02rem;line-height:1.4}
.lo small{color:var(--mute);font-size:.74rem}
@media(max-width:600px){
  .lang{position:static}
  .lp{left:12px;right:12px;width:auto}
}

/* ---------- animations ---------- */
@keyframes drift{to{transform:translate(6%,-4%) rotate(14deg) scale(1.12)}}
@keyframes rise{from{opacity:0;transform:translateY(28px);filter:blur(6px)}}
@keyframes bob{50%{transform:translateY(-9px)}}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(2.2);opacity:0}}
@keyframes lpop{from{opacity:0;transform:scale(.88) translateY(20px)}}
@media(prefers-reduced-motion:reduce){
  body::before,.tile span,.heroorb::before,.heroorb::after,.rise{animation:none!important}
}
</style>
<script>
// forum-extras.js: language switcher + small interactive effects for the forum
(function () {

  // ================= language =================
  // [code, name in its own language, English name]
  const languages = [
    ['en', 'English', 'English'], ['as', 'অসমীয়া', 'Assamese'], ['bn', 'বাংলা', 'Bengali'], ['brx', 'बड़ो', 'Bodo'],
    ['doi', 'डोगरी', 'Dogri'], ['gu', 'ગુજરાતી', 'Gujarati'], ['hi', 'हिन्दी', 'Hindi'], ['kn', 'ಕನ್ನಡ', 'Kannada'],
    ['ks', 'کٲشُر', 'Kashmiri'], ['gom', 'कोंकणी', 'Konkani'], ['mai', 'मैथिली', 'Maithili'], ['ml', 'മലയാളം', 'Malayalam'],
    ['mni-Mtei', 'ꯃꯩꯇꯩꯂꯣꯟ', 'Manipuri (Meitei)'], ['mr', 'मराठी', 'Marathi'], ['ne', 'नेपाली', 'Nepali'], ['or', 'ଓଡ଼ିଆ', 'Odia'],
    ['pa', 'ਪੰਜਾਬੀ', 'Punjabi'], ['sa', 'संस्कृतम्', 'Sanskrit'], ['sat', 'ᱥᱟᱱᱛᱟᱲᱤ', 'Santali'], ['sd', 'سنڌي', 'Sindhi'],
    ['ta', 'தமிழ்', 'Tamil'], ['te', 'తెలుగు', 'Telugu'], ['ur', 'اردو', 'Urdu']
  ];
  const host = location.hostname;

  // The homepage saves the chosen language in the googtrans cookie, so we just read it here
  const match = document.cookie.match(/googtrans=\/[^\/]*\/([^;]+)/);
  let current = match ? decodeURIComponent(match[1]) : 'en';
  if (!languages.some(function (l) { return l[0] === current; })) current = 'en';

  // fonts for the Indian scripts
  const fonts = document.createElement('link');
  fonts.rel = 'stylesheet';
  fonts.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&family=Noto+Sans+Bengali&family=Noto+Sans+Gujarati&family=Noto+Sans+Gurmukhi&family=Noto+Sans+Kannada&family=Noto+Sans+Malayalam&family=Noto+Sans+Oriya&family=Noto+Sans+Tamil&family=Noto+Sans+Telugu&family=Noto+Sans+Ol+Chiki&family=Noto+Sans+Meetei+Mayek&family=Noto+Naskh+Arabic&display=swap';
  document.head.appendChild(fonts);

  // hidden box Google Translate needs
  const gt = document.createElement('div');
  gt.id = 'gt';
  gt.className = 'notranslate';
  gt.setAttribute('aria-hidden', 'true');
  document.body.appendChild(gt);

  // the language button in the header
  const wrap = document.createElement('div');
  wrap.className = 'lang notranslate';
  wrap.setAttribute('translate', 'no');
  wrap.innerHTML = '<button class="btn ghost" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="Change language">🌐 <span id="langName">English</span> ▾</button><div class="lp" id="langPanel" role="menu"></div>';
  document.querySelector('header .bar').appendChild(wrap);

  const button = document.getElementById('langBtn');
  const panel = document.getElementById('langPanel');

  languages.forEach(function (l) {
    const b = document.createElement('button');
    b.className = 'lo' + (l[0] === current ? ' on' : '');
    b.setAttribute('role', 'menuitem');
    b.setAttribute('lang', l[0]);
    b.innerHTML = '<b>' + l[1] + '</b><small>' + l[2] + '</small>';
    b.onclick = function () { setLanguage(l[0]); };
    panel.appendChild(b);
    if (l[0] === current) document.getElementById('langName').textContent = l[1];
  });

  function setLanguage(code) {
    const expired = 'expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
    if (code === 'en') {
      document.cookie = 'googtrans=;' + expired;
      document.cookie = 'googtrans=;' + expired + ';domain=' + host;
      document.cookie = 'googtrans=;' + expired + ';domain=.' + host;
    } else {
      document.cookie = 'googtrans=/en/' + code + ';path=/';
      if (host.indexOf('.') > 0) document.cookie = 'googtrans=/en/' + code + ';path=/;domain=.' + host;
    }
    location.reload();
  }

  function togglePanel(open) {
    panel.classList.toggle('open', open);
    button.setAttribute('aria-expanded', open);
  }
  button.onclick = function (e) { e.stopPropagation(); togglePanel(!panel.classList.contains('open')); };
  document.addEventListener('click', function (e) { if (!panel.contains(e.target)) togglePanel(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') togglePanel(false); });

  // translate the page straight away if a language was picked on the homepage
  if (current !== 'en') {
    window.gtInit = function () {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: languages.slice(1).map(function (l) { return l[0]; }).join(','),
        autoDisplay: false
      }, 'gt');
    };
    const script = document.createElement('script');
    script.src = 'https://translate.google.com/translate_a/element.js?cb=gtInit';
    document.head.appendChild(script);
  }

  // ================= effects =================

  // header gets darker after scrolling and shows a progress line
  const header = document.querySelector('header');
  function onScroll() {
    header.classList.toggle('s', scrollY > 40);
    header.style.setProperty('--sp', scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight));
  }
  addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  // glow on cards and tiles follows the mouse
  document.addEventListener('pointermove', function (e) {
    const el = e.target.closest && e.target.closest('.card, .tile');
    if (!el) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty('--x', e.clientX - r.left + 'px');
    el.style.setProperty('--y', e.clientY - r.top + 'px');
  });

  // Cards fade in when you open a new screen. The forum redraws itself whenever a
  // vote or comment arrives, so we only animate when the screen itself changes.
  const app = document.getElementById('app');
  const animated = '.card, .tile, .enter, .hero, .feats, .top, .tabs';
  let lastScreen = '';

  function currentScreen() {
    try { return [view, openId, act, ctab, ob.i, S.threads.length > 0].join('|'); }
    catch (e) { return 'unknown'; }
  }

  function animateNewScreen() {
    const screen = currentScreen();
    if (screen === lastScreen) return;
    lastScreen = screen;
    let n = 0;
    [].forEach.call(app.querySelectorAll(animated), function (el) {
      if (el.parentElement.closest(animated)) return;   // skip things inside other cards
      el.style.setProperty('--i', Math.min(n++, 10));
      el.classList.add('rise');
    });
  }
  new MutationObserver(animateNewScreen).observe(app, { childList: true });
  animateNewScreen();

})();
</script>
